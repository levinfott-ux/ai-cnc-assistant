<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNC AI Assistant</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#0b1220;color:#eef3f8}main{max-width:1050px;margin:auto;padding:22px}.card{background:#121c2d;border:1px solid #26364f;border-radius:14px;padding:18px;margin:15px 0}.drop{border:2px dashed #3b506f;border-radius:12px;padding:22px;text-align:center}.preview{max-width:100%;max-height:420px;margin-top:14px;border-radius:8px}button{background:#2d7ff9;color:#fff;border:0;padding:11px 15px;border-radius:8px;margin:6px 6px 0 0}textarea,pre{width:100%;box-sizing:border-box;background:#08101d;color:#eef3f8;border:1px solid #334761;border-radius:8px;padding:12px;margin-top:10px;white-space:pre-wrap}.status{padding:12px;border-radius:8px;background:#0d1727;margin-top:10px}.ok{border-left:4px solid #35c46a}.warn{border-left:4px solid #f0b429}.tag{display:inline-block;background:#22344f;padding:7px 10px;border-radius:999px;margin:4px}.small{font-size:13px;color:#94a4b8}</style></head><body><main><h1>⚙️ CNC AI Assistant</h1><p>Technical drawing OCR and feature analysis.</p><section class="card"><div class="drop"><b>Upload a technical drawing</b><br><span class="small">PNG, JPG or WEBP</span><br><input id="file" type="file" accept="image/*"><br><button id="ocr">🔍 Extract engineering dimensions</button></div><img id="preview" class="preview" hidden><div id="status" class="status">Waiting for a drawing.</div></section><section class="card"><h2>1. Drawing analysis</h2><button id="analyze">Analyze drawing</button><div id="analysis" class="status">Extract the drawing first.</div><textarea id="features" rows="16" placeholder="OCR and detected dimensions will appear here."></textarea></section><section class="card"><h2>2. Process recognition</h2><button id="processBtn">Detect features</button><div id="process" class="status">No process detected yet.</div></section></main><script>
const $=x=>document.getElementById(x);let file=null;
$('file').onchange=e=>{file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').hidden=false;$('status').textContent='Drawing loaded. Tap Extract engineering dimensions.'};r.readAsDataURL(file)};
function imageFromFile(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
function crop(img,x,y,w,h,mode){let c=document.createElement('canvas'),ctx=c.getContext('2d'),scale=Math.min(4,4200/(w||1));c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,x,y,w,h,0,0,c.width,c.height);if(mode){let d=ctx.getImageData(0,0,c.width,c.height);for(let p=0;p<d.data.length;p+=4){let g=.299*d.data[p]+.587*d.data[p+1]+.114*d.data[p+2];if(mode==='bw')g=g>170?255:0;else if(mode==='contrast')g=Math.max(0,Math.min(255,(g-128)*1.8+128));d.data[p]=d.data[p+1]=d.data[p+2]=g}ctx.putImageData(d,0,0)}return c.toDataURL('image/png')}
async function ocr(src,opts){let r=await Tesseract.recognize(src,'eng',opts||{});return r.data.text||''}
function norm(s){return s.replace(/[⌀Øø]/g,'Ø').replace(/[−–—]/g,'-').replace(/[×]/g,'x').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').trim()}
function compactDigits(s){return s.replace(/(?<=\d)\s+(?=\d)/g,'').replace(/\s*\.\s*/g,'.').replace(/\s*([±+\-\/])\s*/g,'$1').replace(/\s*x\s*/gi,'x').replace(/\s*°\s*/g,'°').replace(/Ø\s+/g,'Ø')}
function extractDims(text){let lines=text.split(/\n+/).map(x=>compactDigits(norm(x))).filter(Boolean),out=[];const add=x=>{x=compactDigits(norm(x)).replace(/^[^0-9Ø]+/,'').trim();if(!x||/^\d$/.test(x)||out.includes(x))return;if(/\d/.test(x))out.push(x)};
const pats=[/(?:Ø\s*)?\d{1,3}\.\d+\s*(?:±\s*0?\.\d+|[+\-]\s*0?\.\d+(?:\/\s*0?\.\d+)?)/gi,/(?:Ø\s*)?\d{1,3}\s*±\s*0?\.\d+/gi,/(?:Ø\s*)?\d{1,3}\s*[+\-]\s*0?\.\d+(?:\/\s*0?\.\d+)?/gi,/(?:Ø\s*)?\d{1,3}\.\d+/gi,/(?:Ø\s*)?\d{2,3}/gi,/\d+(?:\.\d+)?x45°?/gi];
for(let line of lines){if(/detail|scale|revision|date|weight|viat instruments|inspection plan|supplier|consignment/i.test(line)&&!/[Ø±]/.test(line))continue;for(let p of pats)for(let m of line.matchAll(p))add(m[0])}
const merged=compactDigits(norm(text));for(let m of merged.matchAll(/(?:Ø\s*)?\d{1,3}(?:\.\d+)?\s*(?:±\s*0?\.\d+|[+\-]\s*0?\.\d+(?:\/\s*0?\.\d+)?)?/gi)){let v=m[0];if(/[.±Ø+\-]/.test(v)&&/\d/.test(v))add(v)}
return out.filter(x=>!/^\d{1,2}$/.test(x)||/[Ø±+\-\.]/.test(x)).slice(0,60)}
function classify(t){let x=t.toLowerCase(),a=[];if(/spindle|shaft|turning|lathe|diameter|ø/.test(x))a.push('OD Turning');if(/groove|grooving|slot/.test(x))a.push('Grooving');if(/chamfer|45°|45 degree|x45/.test(x))a.push('Chamfering');if(/hole|drill|through|thru/.test(x))a.push('Drilling');if(/bore|internal diameter/.test(x))a.push('Boring');if(/thread|pitch|m\d/.test(x))a.push('Threading');return [...new Set(a)]}
$('ocr').onclick=async()=>{if(!file){$('status').textContent='Please upload a drawing first.';return}try{$('status').textContent='Preparing high-resolution drawing regions…';let img=await imageFromFile(file),w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;let regions=[{x:0,y:0,w:w*.64,h:h*.70,name:'main view'},{x:w*.56,y:0,w:w*.44,h:h*.56,name:'detail views'},{x:0,y:h*.18,w:w*.72,h:h*.48,name:'dimension band'}];let normal=[],dim=[];for(let r of regions){$('status').textContent='Reading '+r.name+'…';normal.push(await ocr(crop(img,r.x,r.y,r.w,r.h,'contrast'),{tessedit_pageseg_mode:11}));dim.push(await ocr(crop(img,r.x,r.y,r.w,r.h,'bw'),{tessedit_pageseg_mode:11,tessedit_char_whitelist:'0123456789Ø±+-.xX°/'}))}let raw=normal.join('\n\n'),dtext=dim.join('\n'),dims=extractDims(dtext+'\n'+raw),clues=classify(raw+'\n'+dtext);$('features').value='--- OCR TEXT ---\n'+raw+'\n\n--- DIMENSION-PASS OCR ---\n'+dtext+'\n\n--- ENGINEERING DIMENSIONS ---\n'+(dims.length?dims.join('\n'):'No reliable dimensions found yet.');$('analysis').className='status ok';$('analysis').innerHTML=(clues.length?'Detected clues: '+clues.map(x=>'<span class="tag">'+x+'</span>').join(''):'No feature clues yet.');$('status').className='status ok';$('status').textContent='High-resolution multi-pass OCR complete. Dimensions were read with a numeric/symbol-focused pass.'}catch(e){$('status').className='status warn';$('status').textContent='OCR error: '+e.message}};
$('analyze').onclick=()=>{let c=classify($('features').value);$('analysis').className='status '+(c.length?'ok':'warn');$('analysis').innerHTML=c.length?'Detected clues: '+c.map(x=>'<span class="tag">'+x+'</span>').join(''):'No reliable feature clues yet.'};
$('processBtn').onclick=()=>{let c=classify($('features').value);$('process').className='status '+(c.length?'ok':'warn');$('process').innerHTML=c.length?'Likely operations: '+c.map(x=>'<span class="tag">'+x+'</span>').join(''):'Manual review needed. The drawing geometry should be verified before any machining decision.'};
</script></body></html>
